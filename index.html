<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Circle Clicker</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { display: grid; grid-template-columns: minmax(0, 1fr) 298px; grid-template-rows: auto 1fr auto; margin: 0; min-height: 100svh; background: #111827; color: #f8fafc; }
    header { grid-column: 1 / -1; text-align: center; padding: 28px 16px 8px; }
    h1 { margin: 0 0 12px; font-size: 1.5rem; font-weight: 600; }
    #score { margin: 0; font-size: 2rem; font-variant-numeric: tabular-nums; }
    #rate { color: #a5f3fc; margin: 8px 0; }
    main { min-width: 0; min-height: 340px; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 24px; padding: 32px; }
    .circle { width: min(220px, 36vw, 40svh); flex-shrink: 0; aspect-ratio: 1; border-radius: 50%; border: 3px solid #a5f3fc; background: #22d3ee; color: #082f49; font: 700 2rem system-ui, sans-serif; cursor: pointer; touch-action: manipulation; user-select: none; box-shadow: 0 8px 0 #0891b2, 0 12px 45px #22d3ee25; transition: transform 80ms, box-shadow 80ms; }
    .circle:hover { background: #67e8f9; }
    .circle:active { transform: translateY(5px); box-shadow: 0 3px 0 #0891b2; }
    .circle:focus-visible { outline: 4px solid #f8fafc; outline-offset: 8px; }
    #second-circle { background: #c4b5fd; border-color: #ddd6fe; box-shadow: 0 8px 0 #8b5cf6, 0 12px 45px #a78bfa25; }
    #second-circle:hover { background: #ddd6fe; }
    #second-circle:active { box-shadow: 0 3px 0 #8b5cf6; }
    footer { grid-column: 1 / -1; text-align: center; padding: 24px 16px; color: #cbd5e1; pointer-events: none; }
    .shop { align-self: center; margin: 16px 24px 16px 0; width: 274px; padding: 20px; background: #1e293b; border: 1px solid #475569; border-radius: 16px; }
    .shop h2 { margin: 0 0 16px; }
    .item h3 { margin: 0 0 8px; }
    .item + .item { margin-top: 18px; padding-top: 18px; border-top: 1px solid #475569; }
    .item p { color: #cbd5e1; line-height: 1.5; margin: 8px 0; }
    .buy { width: 100%; margin-top: 8px; padding: 12px; font: 600 1rem system-ui, sans-serif; border: 0; border-radius: 8px; background: #67e8f9; color: #082f49; cursor: pointer; }
    .buy:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
    .buy:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    @media (max-width: 900px) {
      body { display: block; }
      main { min-height: 340px; padding: 24px 16px; gap: 16px; }
      .shop { position: static; transform: none; width: min(90%, 420px); margin: 0 auto 24px; }
      footer { position: static; padding-bottom: 24px; }
    }
  </style>
</head>
<body>
  <header><h1>Circle Clicker</h1><p id="score" role="status" aria-live="polite">Points: 0</p><p id="rate">0 points per second</p></header>
  <main><button class="circle" id="circle" type="button" aria-label="Click circle to earn one point">+1</button><button class="circle" id="second-circle" type="button" aria-label="Click second circle to earn one point" hidden>+1</button></main>
  <aside class="shop" aria-label="Shop"><h2>Shop</h2><div id="shop-items"></div></aside>
  <footer><span id="click-hint">Click the circle. Earn 1 point.</span><br><small>Progress resets when you reload.</small></footer>
  <script>
    let points = 0;
    const score = document.querySelector('#score');
    const rateDisplay = document.querySelector('#rate');

    // Add future shop items here. Each entry gets its own ownership and price.
    const shopCatalog = [
      { id: 'generator', name: 'Generator', description: 'The first earns 1 point per second. Each new generator makes every generator 50% stronger.', basePrice: 10, priceGrowth: 1.5, pointsPerSecond: 1, productionGrowth: 1.5 },
      { id: 'click-power', name: 'Click Power', description: 'Adds 1 point per click to the first circle. The second circle keeps its 30% bonus.', basePrice: 25, priceGrowth: 1.5, pointsPerSecond: 0, pointsPerClick: 1 },
      { id: 'second-circle', name: 'Second Circle', description: 'Unlocks a second circle with 30% more points per click. Shares your score and benefits from Click Power.', basePrice: 100, priceGrowth: 1, pointsPerSecond: 0, maxOwned: 1 }
    ];
    const owned = Object.fromEntries(shopCatalog.map(item => [item.id, 0]));
    const itemElements = new Map();
    const priceOf = item => Math.ceil(item.basePrice * item.priceGrowth ** owned[item.id]);
    const rateFor = (item, count) => count * item.pointsPerSecond * (item.productionGrowth || 1) ** Math.max(0, count - 1);
    const productionRate = () => shopCatalog.reduce((total, item) => total + rateFor(item, owned[item.id]), 0);
    const formatRate = value => new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 }).format(value);
    const clickPower = () => 1 + shopCatalog.reduce((total, item) => total + owned[item.id] * (item.pointsPerClick || 0), 0);
    const awardFor = circle => clickPower() * (circle.id === 'second-circle' ? 1.3 : 1);
    let lastProductionTime = performance.now();
    let partialPoint = 0;

    function collectProduction() {
      const now = performance.now();
      partialPoint += (now - lastProductionTime) / 1000 * productionRate();
      lastProductionTime = now;
      const earned = Math.floor(partialPoint + 1e-9);
      points += earned;
      partialPoint = Math.max(0, partialPoint - earned);
    }

    function render() {
      score.textContent = `Points: ${Number(points.toFixed(1))}`;
      const rate = productionRate();
      rateDisplay.textContent = `${formatRate(rate)} ${rate === 1 ? 'point' : 'points'} per second`;
      const perClick = clickPower();
      const secondUnlocked = owned['second-circle'] > 0;
      document.querySelector('#second-circle').hidden = !secondUnlocked;
      document.querySelectorAll('.circle').forEach((circle, index) => {
        const award = Number(awardFor(circle).toFixed(1));
        circle.textContent = `+${award}`;
        circle.setAttribute('aria-label', `Click ${index ? 'second circle' : 'circle'} to earn ${award} ${award === 1 ? 'point' : 'points'}`);
      });
      document.querySelector('#click-hint').textContent = secondUnlocked
        ? `First circle: +${perClick}. Second circle: +${Number((perClick * 1.3).toFixed(1))} points (30% more).`
        : `Click the circle. Earn ${perClick} ${perClick === 1 ? 'point' : 'points'}.`;
      for (const item of shopCatalog) {
        const elements = itemElements.get(item.id);
        elements.owned.textContent = `Owned: ${owned[item.id]}`;
        const soldOut = owned[item.id] >= (item.maxOwned ?? Infinity);
        elements.buy.textContent = soldOut ? 'Purchased' : `Buy — ${priceOf(item)} points`;
        elements.buy.disabled = soldOut || points < priceOf(item);
        if (elements.production) {
          const count = owned[item.id];
          const current = rateFor(item, count);
          const extra = rateFor(item, count + 1) - current;
          const perUnit = count ? current / count : 0;
          const each = count ? `Each: ${formatRate(perUnit)} ${perUnit === 1 ? 'point' : 'points'}/sec. ` : '';
          elements.production.textContent = `${each}Next purchase: +${formatRate(extra)} ${extra === 1 ? 'point' : 'points'}/sec total.`;
        }
      }
    }

    for (const item of shopCatalog) {
      const card = document.createElement('section');
      card.className = 'item';
      card.dataset.item = item.id;
      const title = document.createElement('h3');
      title.textContent = item.name;
      const description = document.createElement('p');
      description.textContent = item.description;
      const ownership = document.createElement('p');
      ownership.className = 'owned';
      let production;
      if (item.pointsPerSecond) {
        production = document.createElement('p');
        production.className = 'production';
      }
      const buy = document.createElement('button');
      buy.type = 'button';
      buy.className = 'buy';
      buy.addEventListener('click', () => {
        collectProduction();
        const price = priceOf(item);
        if (points >= price && owned[item.id] < (item.maxOwned ?? Infinity)) {
          points -= price;
          owned[item.id] += 1;
        }
        render();
      });
      card.append(title, description, ownership, buy);
      if (production) card.insertBefore(production, buy);
      document.querySelector('#shop-items').append(card);
      itemElements.set(item.id, {owned: ownership, buy, production});
    }

    document.querySelectorAll('.circle').forEach(circle => circle.addEventListener('click', () => {
      if (circle.hidden) return;
      collectProduction();
      points = Math.round((points + awardFor(circle)) * 10) / 10;
      render();
    }));
    setInterval(() => { collectProduction(); render(); }, 100);
    render();
  </script>
</body>
</html>
